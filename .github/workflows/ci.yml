name: CI

# H-07: least-privilege token by default. Jobs widen only what they need.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [zh, en, unified]

    steps:
      # Pinned to full commit SHA to mitigate action supply-chain compromise.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Run unit tests with coverage
        run: ./gradlew test${{ matrix.flavor }}DebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.flavor }}
          path: app/build/reports/tests/test${{ matrix.flavor }}DebugUnitTest/

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - name: Run unified tests
        run: ./gradlew testUnifiedDebugUnitTest jacocoTestReport --no-daemon
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - run: ./gradlew lintZhDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results*

  verify-pins:
    name: Verify Cert Pins vs Live Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # H-05: verify the SPKI pins declared in network_security_config.xml actually
      # match the live certificate chain of each pinned host. A mismatch means rule
      # downloads would fail closed on real devices, so the build must fail.
      # Whole-chain check: GitHub/CDN edges rotate LEAF certs per region, so any
      # certificate in the presented chain (leaf + intermediates) may match; this
      # mirrors Android's network_security_config <pin-set> "any pin matches any
      # chain cert" semantics instead of failing on a single observed leaf.
      # GitHub endpoints: hard-required. cloudflare-dns.com: some networks block it,
      # so connection failure is tolerated (DoH falls back to AliDNS), but if it
      # connects the pin MUST match.
      - name: Compare pinned SPKI to live chain
        run: |
          set -euo pipefail
          check_pin() {
            local host="$1"; shift
            local tmpdir
            tmpdir=$(mktemp -d)
            if ! echo | timeout 15 openssl s_client -connect "$host:443" -servername "$host" -showcerts 2>/dev/null > "$tmpdir/chain.pem"; then
              rm -rf "$tmpdir"
              echo "SKIP $host: could not fetch live chain (network blocked)"
              return 1
            fi
            # Split the combined PEM chain into one file per certificate.
            awk -v D="$tmpdir" 'BEGIN{c=0;inC=0} /BEGIN CERTIFICATE/{c++;inC=1} inC{print > (D "/cert_" c ".pem")} /END CERTIFICATE/{inC=0}' "$tmpdir/chain.pem"
            local rc=1 spki
            for cf in "$tmpdir"/cert_*.pem; do
              [ -e "$cf" ] || continue
              spki=$(openssl x509 -in "$cf" -pubkey -noout 2>/dev/null \
                | openssl pkey -pubin -outform der 2>/dev/null \
                | openssl dgst -sha256 -binary 2>/dev/null \
                | openssl base64 -A 2>/dev/null)
              [ -n "$spki" ] || continue
              echo "     $host: cert SPKI=$spki"
              for expected in "$@"; do
                if [ "$spki" = "$expected" ]; then
                  echo "OK   $host: pin matches ($spki)"
                  rc=0
                fi
              done
            done
            rm -rf "$tmpdir"
            if [ "$rc" -ne 0 ]; then
              echo "FAIL $host: no certificate in live chain matched configured pin set"
              return 2
            fi
            return 0
          }
          rc=0
          check_pin raw.githubusercontent.com \
            "u5HUV+53eJaqAZQekPBc2vbRb9LvpJzlK8dhGLIPF+o=" \
            "p4MbBTfU3MTzqPxM2Cjv0q3WON8L6FqSzam65NVEkcM=" \
            "k2v657xBsOVe1PQRwWoDp9Fxfi2I4l4GlRnNfCeIDrI=" \
            "RRM1dGqnDFsCJXBTHky16vi1obOlCgFFn/yOhI/y+ho=" || rc=$?
          check_pin api.github.com \
            "cgAMm7z20VINmtPjImmTrEl882gSBr0fIhdLTtHveyY=" \
            "S2LUIbq4yUg5w+MYbj5LZOWAZAzaeNGJ9rTTc4GjvBQ=" \
            "k2v657xBsOVe1PQRwWoDp9Fxfi2I4l4GlRnNfCeIDrI=" \
            "RRM1dGqnDFsCJXBTHky16vi1obOlCgFFn/yOhI/y+ho=" || rc=$?
          # Cloudflare: tolerant of network-blocked environments.
          check_pin cloudflare-dns.com \
            "yio0sMlhW0kS4fJo1pJl0tF6TvG3EKGY0pmMgkGnVY=" \
            "i7WTqTvh0OioIruIfFR4kMPnBqrS2rdiVPl/s2uC/CY=" \
            "ltQ6aXy3tqpNZKJdnevMD7oR+IsI5rNWbOssFDrl+Ew=" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::certificate pin mismatch detected"
            exit "$rc"
          fi

  build:
    name: Build ${{ matrix.flavor }} Release
    runs-on: ubuntu-latest
    # Build job only runs on protected push to main; it reads the signing secret.
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [unit-test, lint, verify-pins]
    strategy:
      fail-fast: false
      matrix:
        flavor: [zh, en, unified]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          # H-07: decode OUTSIDE the repo checkout (RUNNER_TEMP) and restrict perms,
          # so the signing key never sits in the working tree.
          printf '%s' "$KEYSTORE_B64" > "$RUNNER_TEMP/keystore.b64"
          base64 -d "$RUNNER_TEMP/keystore.b64" > "$RUNNER_TEMP/release.jks"
          rm -f "$RUNNER_TEMP/keystore.b64"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          cat > keystore.properties << EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEYSTORE_PASS
          keyAlias=guard
          storeFile=$RUNNER_TEMP/release.jks
          EOF
          chmod 600 keystore.properties

      - name: Build ${{ matrix.flavor }} Release
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g\n' >> gradle.properties
          ./gradlew assemble${{ matrix.flavor }}Release --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk

      - name: Clean up signing material
        if: always()
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.b64"
