name: CI

# H-07: least-privilege token by default. Jobs widen only what they need.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [zh, en, unified]

    steps:
      # Pinned to full commit SHA to mitigate action supply-chain compromise.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Run unit tests with coverage
        run: ./gradlew test${{ matrix.flavor }}DebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.flavor }}
          path: app/build/reports/tests/test${{ matrix.flavor }}DebugUnitTest/

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - name: Run unified tests
        run: ./gradlew testUnifiedDebugUnitTest jacocoTestReport --no-daemon
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - run: ./gradlew lintZhDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results*

  build:
    name: Build ${{ matrix.flavor }} Release
    runs-on: ubuntu-latest
    # Build job only runs on protected push to main; it reads the signing secret.
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [unit-test, lint]
    strategy:
      fail-fast: false
      matrix:
        flavor: [zh, en, unified]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p app
          printf '%s' "$KEYSTORE_B64" > /tmp/keystore.b64
          base64 -d /tmp/keystore.b64 > app/release.jks
          rm -f /tmp/keystore.b64

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          cat > keystore.properties << EOF
          storePassword=$KEYSTORE_PASS
          keyPassword=$KEYSTORE_PASS
          keyAlias=guard
          storeFile=release.jks
          EOF

      - name: Build ${{ matrix.flavor }} Release
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g\n' >> gradle.properties
          ./gradlew assemble${{ matrix.flavor }}Release --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.flavor }}-release
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release.apk
